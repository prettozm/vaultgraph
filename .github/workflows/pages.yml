name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build viewer
        run: npm run build:viewer

      # The branch-mode site serves the app at /viewer/src/; keep those URLs working when the
      # Actions deployment (app at the site root) is the one being served. Query string preserved.
      - name: Keep /viewer/src/ URLs working
        run: |
          mkdir -p viewer/dist/viewer/src
          cat > viewer/dist/viewer/src/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Vault Graph</title>
          <script>location.replace(new URL('../../' + location.search + location.hash, location.href).href);</script>
          <p>Redirecting to the <a href="../../">Vault Graph viewer</a>…</p>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
